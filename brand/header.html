<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body { width: 1500px; height: 500px; position: relative; color: #d8f6ff; font-family: "Space Grotesk", sans-serif; }
.dots { -webkit-mask-image: radial-gradient(ellipse at 72% 45%, #000 15%, transparent 80%); mask-image: radial-gradient(ellipse at 72% 45%, #000 15%, transparent 80%); }
.halo { position: absolute; right: 120px; top: 30px; width: 470px; height: 470px; border-radius: 50%; background: radial-gradient(circle, rgba(34,229,255,0.30), rgba(61,107,255,0.12) 48%, transparent 70%); filter: blur(24px); }
.logo { position: absolute; right: 95px; top: 10px; width: 520px;
        -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 58%, transparent 70%); mask-image: radial-gradient(circle at 50% 44%, #000 58%, transparent 70%); }
.beam { position: absolute; left: 0; right: 0; top: 352px; height: 2px; background: linear-gradient(90deg, transparent 0%, rgba(34,229,255,.15) 20%, #22e5ff 60%, #fff 72%, #22e5ff 80%, transparent 100%); box-shadow: 0 0 22px 3px rgba(34,229,255,.45); }
.copy { position: absolute; left: 430px; top: 92px; width: 560px; }
.kicker { font: 700 15px "JetBrains Mono", monospace; letter-spacing: .26em; color: #19e6a0; display: flex; align-items: center; gap: 12px; }
.kicker i { width: 9px; height: 9px; border-radius: 50%; background: #19e6a0; box-shadow: 0 0 12px #19e6a0; }
h1 { margin-top: 18px; font-size: 66px; line-height: 1.02; letter-spacing: -0.02em; font-weight: 700; }
h1 span { background: linear-gradient(90deg, #19e6a0, #22e5ff 45%, #3d6bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand { margin-top: 26px; font: 700 18px "JetBrains Mono", monospace; letter-spacing: .34em; }
.brand b { color: #22e5ff; }
.url { margin-top: 8px; font: 500 16px "JetBrains Mono", monospace; color: #7fa6b4; letter-spacing: .06em; }
</style></head><body>
<div class="dots"></div><div class="halo"></div><img class="logo" src="logo.webp"><div class="beam"></div>
<div class="copy">
  <div class="kicker"><i></i>MCP SERVER · ELYSIUM</div>
  <h1>Give your AI<br><span>eyes on-chain.</span></h1>
  <div class="brand">LYNO <b>AGENT</b></div>
  <div class="url">www.lynoagent.com</div>
</div>
</body></html>
